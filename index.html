
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameWorld - Discover PC Games</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0B0F14;
      color: #D8DFE8;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px 6%;
      background: #151B23;
      border-bottom: 1px solid #27313D;
    }
    .logo { color: #6996CB; font-size: 26px; font-weight: bold; }
    main { max-width: 1100px; margin: 50px auto; padding: 0 20px; }
    h1 { font-size: 32px; }
    .subtitle { color: #A7B4C5; }
    .search {
      width: 100%;
      padding: 15px;
      margin: 25px 0 15px;
      background: #151B23;
      color: white;
      border: 1px solid #344153;
      border-radius: 9px;
      font-size: 16px;
    }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      padding: 10px 16px;
      background: #151B23;
      color: #D8DFE8;
      border: 1px solid #344153;
      border-radius: 8px;
      cursor: pointer;
    }
    button.active { background: #6996CB; color: #0B0F14; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }
.card {
  background: #151B23;
  border: 1px solid #27313D;
  border-radius: 14px;
  padding: 16px;
  overflow: hidden;
  transition: transform 0.25s ease, border-color 0.25s ease;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #6996CB;
}

.card h3 {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.35;
  min-height: 52px;
  margin: 16px 0 8px;
  color: #F1F5FB;
}

.card .desc {
  color: #A7B4C5;
  font-size: 14px;
  line-height: 1.6;
}

.card button {
  background: #151B23;
  color: #D8DFE8;
  border: 1px solid #344153;
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.card button:hover {
  background-color: #31547A !important;
  border-color: #80B5F0 !important;
  color: #FFFFFF !important;
}

    .art {
  background: #222C38;
  text-align: center;
  padding: 0;
  border-radius: 8px;
  font-size: 35px;
  overflow: hidden;
  height: 300px;
}

.art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
    .meta { color: #91A7BD; font-size: 13px; }
    .desc { color: #A7B4C5; font-size: 14px; }

  .featured {
  min-height: 360px;
  background:
    linear-gradient(
      90deg,
      rgba(11, 15, 20, 0.95) 0%,
      rgba(11, 15, 20, 0.5) 55%,
      rgba(11, 15, 20, 0.1) 100%
    ),
    url("images/wukong-banner.jpg") center / cover no-repeat;

  border-radius: 16px;
  display: flex;
  align-items: flex-end;
  padding: 40px;
  overflow: hidden;
}

.featured-content {
  max-width: 520px;
}

.featured-label {
  color: #8CB8F0;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.featured h2 {
  font-size: 38px;
  color: white;
  margin: 12px 0;
}

.featured-button {
  display: inline-block;
  margin-top: 15px;
  padding: 13px 22px;
  background: #6996CB;
  color: #0B0F14;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

.featured-button:hover {
  background: #8CB8F0;
}

/* GameWorld Modern Game Cards */

#games .card {
  background: #141B24;
  border: 1px solid #293646;
  border-radius: 16px;
  padding: 14px;
  overflow: hidden;
  transition:
    transform 0.25s ease,
    border-color 0.25s ease,
    box-shadow 0.25s ease;
}

#games .card:hover {
  transform: translateY(-5px);
  border-color: #6996CB;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
}

#games .art {
  height: 320px;
  border-radius: 12px;
  overflow: hidden;
  background: #222C38;
}

#games .art img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  transition: transform 0.35s ease;
}

#games .card:hover .art img {
  transform: scale(1.035);
}

#games .card h3 {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.35;
  min-height: 52px;
  margin: 16px 0 8px;
  color: #F1F5FB;
}

#games .meta {
  font-size: 13px;
  color: #9DB1C8;
  line-height: 1.5;
}

#games .desc {
  font-size: 13px;
  color: #A7B4C5;
  line-height: 1.5;
}

#games .card button {
  border-radius: 9px;
  padding: 9px 13px;
}

#games .card button:hover {
  background: #31547A;
  border-color: #80B5F0;
  color: #FFFFFF;
}

  /* GameWorld Mobile Optimization */

@media (max-width: 600px) {

  main {
    padding-left: 14px;
    padding-right: 14px;
  }

  .hero {
    margin-bottom: 24px;
  }

  .hero h1 {
    font-size: 30px;
    line-height: 1.2;
  }

  .filters {
    gap: 10px;
  }

  .filters select {
    max-width: 100%;
    font-size: 14px;
  }

  #games {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  #games .art {
    height: 300px;
  }

  #games .card {
    padding: 12px;
  }

}  

  /* GameWorld Mobile Card Compact Layout */

@media (max-width: 600px) {

  #games .card {
    padding: 12px;
    border-radius: 14px;
  }

  #games .art {
    height: 280px;
  }

  #games .card h3 {
    font-size: 20px;
    min-height: 0;
    margin: 12px 0 8px;
    line-height: 1.3;
  }

  #games .card .meta {
    margin: 7px 0;
    line-height: 1.5;
  }

  #games .card .desc {
    margin: 10px 0;
    line-height: 1.5;
  }

  #games .card button {
    padding: 9px 12px;
    font-size: 13px;
  }

  #games .game-region {
    margin: 10px 0;
    padding: 10px;
  }

}

  /* GameWorld Header Country Selector */

.site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.header-country {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}

.header-country label {
  color: #A7B4C5;
  font-size: 12px;
}

.header-country select {
  padding: 10px 12px;
  background: #0B0F14;
  color: #D8DFE8;
  border: 1px solid #344153;
  border-radius: 8px;
  font-size: 14px;
  max-width: 100%;
}

@media (max-width: 600px) {
  .site-header {
    padding: 14px;
  }

  .site-header .logo {
    font-size: 22px;
  }

  .header-country select {
    max-width: 150px;
  }
}

/* GameWorld Wide and Slim Statistics */

main > .grid:first-child {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 0 0 20px !important;
}

main > .grid:first-child .card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  min-height: 52px;
  border-radius: 10px;
}

main > .grid:first-child .card h2 {
  font-size: 32px;
  font-weight: 800;
  color: #8CB8F0;
  margin: 0;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

main > .grid:first-child .card p {
  font-size: 13px;
  margin: 0;
  color: #A7B4C5;
}

@media (max-width: 600px) {
  main > .grid:first-child {
    gap: 6px;
  }

  main > .grid:first-child .card {
    padding: 8px;
    gap: 5px;
  }

  main > .grid:first-child .card h2 {
    font-size: 24px;
  }

  main > .grid:first-child .card p {
    font-size: 10px;
  }
}

  </style>

</head>
<body>
  <header class="site-header">
  <div class="logo">GameWorld</div>

  <div class="header-country">
    <label for="homeCountry">Your Country / Region</label>

    <select id="homeCountry" onchange="saveCountry()">
      <option value="Philippines">Philippines</option>
      <option value="Malaysia">Malaysia</option>
      <option value="Singapore">Singapore</option>
      <option value="Other">Other</option>
    </select>
  </div>
</header>

  <main>

    <div class="grid" style="margin:20px 0;">
  <div class="card">
    <h2 id="totalGames">0</h2>
    <p>Total Games</p>
  </div>

  <div class="card">
    <h2 id="totalCountries">0</h2>
    <p>Countries</p>
  </div>

  <div class="card">
    <h2 id="totalFavorites">0</h2>
    <p>Favorites</p>
  </div>
</div>

    <section class="featured">     
  <div class="featured-content">
    <p class="featured-label">FEATURED GAME</p>
    <h2>Black Myth: Wukong</h2>
    <p>China · Action RPG</p>
    <a href="game.html?id=wukong" class="featured-button">
      Explore Game
    </a>
  </div>
</section>
   
   <h2 class="section-title">Discover Games</h2>

   <input
      id="search"
      class="search"
      placeholder="Search games..."
      oninput="renderGames()"
   >

<div class="filters">
  <button class="active" onclick="setCountry('All',this)">All</button>
  <button onclick="setCountry('China',this)">China</button>
  <button onclick="setCountry('Japan',this)">Japan</button>
  <button onclick="setCountry('South Korea',this)">South Korea</button>
  <button onclick="setCountry('USA',this)">USA</button>
</div>
<div style="display:flex; gap:15px; flex-wrap:wrap; align-items:center;">
        <div style="margin:15px 0;">
  <label for="sortGames">Sort By: </label>
  <select id="sortGames" onchange="renderGames()"
    style="padding:10px;background:#151B23;color:white;border:1px solid #344153;border-radius:8px;">
    <option value="default">Default</option>
    <option value="az">Name A-Z</option>
    <option value="za">Name Z-A</option>
  </select>
</div>
<div style="margin:15px 0;">
  <label for="genreFilter">Genre: </label>
  <select id="genreFilter" onchange="renderGames()"
    style="padding:10px;background:#151B23;color:white;border:1px solid #344153;border-radius:8px;">
    <option value="All">All Genres</option>
  </select>
</div>

<div style="margin:15px 0;">
  <label for="developerFilter">Developer: </label>
  <select id="developerFilter" onchange="renderGames()"
    style="padding:10px;background:#151B23;color:white;border:1px solid #344153;border-radius:8px;">
    <option value="All">All Developers</option>
  </select>
  </div>
  </div>

<div style="display:flex; gap:15px; flex-wrap:wrap; align-items:center;">  

<div style="margin:15px 0;">
  <button id="favoritesButton" onclick="toggleFavorites()">
    ♡ Favorites Only
  </button>
</div>
<div style="margin:15px 0;">
  <button onclick="resetAllFilters()">
    ↻ Reset Filters
  </button>
</div>  

</div>
   <div id="games" class="grid"></div>

    <h1>Discover PC Games Worldwide</h1>
    <p class="subtitle">
      Explore amazing PC games from around the world.
    </p>




    <p id="resultCount" style="color:#6996CB;"></p>

<div style="display:flex; gap:15px; flex-wrap:wrap; align-items:center;"></div>
  
  </main>

  <script src="games.js"></script>
  <script>
    const games = gameDatabase;

    let selectedCountry = "All";

    let favorites = JSON.parse(
  localStorage.getItem("gameworld_favorites") || "[]"
);

let showFavoritesOnly = false;

function toggleFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(gameId => gameId !== id);
  } else {
    favorites.push(id);
  }

  localStorage.setItem(
    "gameworld_favorites",
    JSON.stringify(favorites)
  );

  renderGames();
}

function toggleFavorites() {
  showFavoritesOnly = !showFavoritesOnly;

  document.getElementById("favoritesButton").textContent =
    showFavoritesOnly ? "♥ Favorites Only" : "♡ Favorites Only";

  renderGames();
}

    function setCountry(country, button) {
      selectedCountry = country;
      document.querySelectorAll(".filters button")
        .forEach(b => b.classList.remove("active"));
      button.classList.add("active");
      renderGames();
    }


function getRegionStatus(game) {
  const country = document.getElementById("homeCountry").value;
  const region = game.availability?.[country];

  if (!region) {
    return `<span style="color:#E4B66B">${country}: Unverified</span>`;
  }

  if (region.status === "available") {
    return `<span style="color:#58BA86">${country}: Officially Available</span>`;
  }

  if (region.status === "restricted") {
    return `<span style="color:#E77777">${country}: Restricted</span>`;
  }

  if (region.status === "unavailable") {
    return `<span style="color:#E77777">${country}: Not Officially Supported</span>`;
  }

  return `<span style="color:#E4B66B">${country}: Unverified</span>`;
}


function getRegionCheckedDate(game) {
  const country = document.getElementById("homeCountry").value;
  const region = game.availability?.[country];

  if (!region || !region.lastChecked) {
    return "Last checked: Never";
  }

  return "Last checked: " + region.lastChecked;
}

function getRegionExpiry(game) {
  const country = document.getElementById("homeCountry").value;
  const region = game.availability?.[country];

  if (!region || !region.lastChecked) {
    return "Verification needed";
  }

  const checkedDate = new Date(region.lastChecked);
  const daysPassed =
    (Date.now() - checkedDate.getTime()) / 86400000;

  if (Number.isNaN(daysPassed)) {
    return "Verification needed";
  }

  if (daysPassed > 90) {
    return "Verification outdated";
  }

  return "Recently checked";
}

function toggleRegionInfo(id) {
  const info = document.getElementById("regionInfo-" + id);

  if (!info) {
    return;
  }

  if (info.style.display === "none") {
    info.style.display = "block";
  } else {
    info.style.display = "none";
  }
}

function resetAllFilters() {

  document.getElementById("developerFilter").value = "All";
  document.getElementById("search").value = "";

  selectedCountry = "All";
  showFavoritesOnly = false;

  document.getElementById("sortGames").value = "default";
  document.getElementById("genreFilter").value = "All";
  document.querySelectorAll(".filters button")
    .forEach(button => button.classList.remove("active"));

  document.querySelector(".filters button")
    .classList.add("active");

  document.getElementById("favoritesButton").textContent =
    "♡ Favorites Only";

  renderGames();
}

function updateStatistics() {
  document.getElementById("totalGames").textContent =
    games.length;

  const countries = games.map(game =>
    game.country === "Korea" ? "South Korea" : game.country
  );

  document.getElementById("totalCountries").textContent =
    new Set(countries).size;

  document.getElementById("totalFavorites").textContent =
    games.filter(game => favorites.includes(game.id)).length;
}


function loadGenres() {
  const select = document.getElementById("genreFilter");

  const genres = [...new Set(games.map(game => game.genre))].sort();

  genres.forEach(genre => {
    const option = document.createElement("option");
    option.value = genre;
    option.textContent = genre;
    select.appendChild(option);
  });
}

function updateGenreStatistics() {
  const counts = {};

  games.forEach(game => {
    counts[game.genre] = (counts[game.genre] || 0) + 1;
  });

  const container = document.getElementById("genreStatistics");

  container.innerHTML = "";

  Object.entries(counts).sort().forEach(([genre, count]) => {
const row = document.createElement("button");

row.textContent = genre + ": " + count;
row.style.display = "inline-block";
row.style.margin = "5px 8px 5px 0";
row.style.cursor = "pointer";

row.onclick = function() {
  document.getElementById("genreFilter").value = genre;
  renderGames();
};

container.appendChild(row);
  });
}

function loadDevelopers() {
  const select = document.getElementById("developerFilter");

  const developers = [...new Set(
    games.map(game => game.developer)
  )].sort();

  developers.forEach(developer => {
    const option = document.createElement("option");
    option.value = developer;
    option.textContent = developer;
    select.appendChild(option);
  });
}

function updateDeveloperStatistics() {
  const counts = {};

  games.forEach(game => {
    counts[game.developer] =
      (counts[game.developer] || 0) + 1;
  });

  const container =
    document.getElementById("developerStatistics");

  container.innerHTML = "";

  Object.entries(counts).sort().forEach(([developer, count]) => {
    const row = document.createElement("button");

    row.textContent = developer + ": " + count;
    row.style.display = "inline-block";
    row.style.margin = "5px 8px 5px 0";
    row.style.cursor = "pointer";

    row.onclick = function() {
      document.getElementById("developerFilter").value = developer;
      renderGames();
    };

    container.appendChild(row);
  });
}

    function renderGames() {
  updateStatistics();

      const search = document.getElementById("search")
        .value.toLowerCase();

      const selectedGenre = document.getElementById("genreFilter").value;
      const selectedDeveloper =
  document.getElementById("developerFilter").value;


const filtered = games.filter(game =>
  (
    selectedCountry === "All" ||
    game.country === selectedCountry ||
    (
      selectedCountry === "South Korea" &&
      game.country === "Korea"
    )
  ) &&
  (
    game.name.toLowerCase().includes(search) ||
    game.genre.toLowerCase().includes(search)
  ) &&
  (!showFavoritesOnly || favorites.includes(game.id)) &&
  (selectedGenre === "All" || game.genre === selectedGenre) &&
  (
    selectedDeveloper === "All" ||
    game.developer === selectedDeveloper
  )
);


      const sortMode = document.getElementById("sortGames").value;

if (sortMode === "az") {
  filtered.sort((a, b) => a.name.localeCompare(b.name));
} else if (sortMode === "za") {
  filtered.sort((a, b) => b.name.localeCompare(a.name));
}

      document.getElementById("resultCount").textContent =
        filtered.length + " games found";

      document.getElementById("games").innerHTML =
        filtered.length
        ? filtered.map(game => `
          <div class="card" onclick="window.location.href='game.html?id=${game.id}'" style="cursor:pointer">
            <div class="art">
  ${game.coverImage
    ? `<img src="${game.coverImage}"
         alt="${game.name}"
         style="width:100%;height:100%;object-fit:cover;border-radius:8px;"
         onerror="this.style.display='none';this.parentElement.append('🎮');">`
    : game.icon}
</div>
            <h3>${game.name}</h3>
            <p class="meta">${game.country} · ${game.genre}</p>
            <p class="meta">${getRegionStatus(game)}</p>
            <p class="meta">${getRegionCheckedDate(game)}</p>
            <p class="meta" style="color:#E4B66B">
  ${getRegionExpiry(game)}
</p>

<button onclick="event.stopPropagation(); toggleRegionInfo('${game.id}')">
  What does this mean?
</button>

<p id="regionInfo-${game.id}" style="display:none;color:#A7B4C5;">
  Unverified means regional availability has not been confirmed.
  Verification needed means there is no recorded check date.
  Always confirm requirements through official sources.
</p>

            <p class="desc">Discover this PC game on GameWorld.</p>
            <button onclick="event.stopPropagation(); toggleFavorite('${game.id}')">
  ${favorites.includes(game.id) ? "♥ Favorited" : "♡ Favorite"}
</button>
          </div>
        `).join("")
        : `
  <div>
    <h3>No games found</h3>
    <p>Try another search or clear your filters.</p>
    <button onclick="clearFilters()">Clear Filters</button>
  </div>
`;
    }

    loadGenres();
    loadDevelopers();
    renderGames();

    function clearFilters() {
  document.getElementById("search").value = "";

  selectedCountry = "All";

  document.querySelectorAll(".filters button")
    .forEach(button => button.classList.remove("active"));

  document.querySelector(".filters button")
    .classList.add("active");

  renderGames();
}

    function saveCountry() {
  const country = document.getElementById("homeCountry").value;
  localStorage.setItem("gameworld_country", country);

renderGames();
}

const savedCountry =
  localStorage.getItem("gameworld_country") || "Philippines";

document.getElementById("homeCountry").value = savedCountry;
  </script>
</body>
</html>
